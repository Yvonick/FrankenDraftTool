<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FrankenDraftTool</title>
    <style>
      :root {
        color: #f7f3ea;
        background: #17191c;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(100% - 2rem, 64rem);
        display: grid;
        gap: 1.25rem;
        justify-items: center;
        padding: 2rem 0;
        text-align: center;
      }

      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(2.5rem, 8vw, 6rem);
        font-weight: 700;
        letter-spacing: 0;
      }

      h2 {
        font-size: clamp(2rem, 6vw, 4rem);
        letter-spacing: 0;
      }

      h3 {
        font-size: 1.2rem;
        letter-spacing: 0;
      }

      h4 {
        font-size: 1rem;
        letter-spacing: 0;
      }

      p,
      li,
      label,
      input,
      select {
        color: #d8cfbd;
        font-size: clamp(1rem, 2.5vw, 1.05rem);
      }

      button {
        min-height: 2.75rem;
        border: 0;
        border-radius: 0.5rem;
        padding: 0 1.25rem;
        color: #17191c;
        background: #f7f3ea;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        color: #f7f3ea;
        background: transparent;
        border: 1px solid #6a6d72;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      input,
      select {
        width: 100%;
        min-height: 2.75rem;
        border: 1px solid #6a6d72;
        border-radius: 0.5rem;
        padding: 0 0.85rem;
        color: #f7f3ea;
        background: #23262a;
        font: inherit;
      }

      ul {
        width: min(100%, 28rem);
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.5rem;
        list-style: none;
      }

      li {
        min-height: 2.5rem;
        display: grid;
        place-items: center;
        border: 1px solid #4a4d52;
        border-radius: 0.5rem;
      }

      .actions,
      .setting-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        align-items: center;
      }

      .panel {
        width: min(100%, 48rem);
        display: grid;
        gap: 0.9rem;
        justify-items: center;
        padding: 1rem;
        border: 1px solid #3f4248;
        border-radius: 0.5rem;
      }

      .settings-grid,
      .item-grid,
      .reveal-grid,
      .spectator-grid {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
        gap: 0.75rem;
      }

      .settings-grid label,
      .modal label {
        display: grid;
        gap: 0.4rem;
        text-align: left;
      }

      .item-card {
        display: grid;
        gap: 0.45rem;
        padding: 0.85rem;
        border: 1px solid #4a4d52;
        border-radius: 0.5rem;
        background: #202327;
        text-align: left;
      }

      .item-image-frame {
        width: 100%;
        position: relative;
        aspect-ratio: var(--image-aspect, 3 / 4);
        border: 1px solid #3f4248;
        border-radius: 0.35rem;
        background-color: #111316;
      }

      .item-image-crop,
      .item-preview-crop {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        border-radius: inherit;
      }

      .item-image-crop img,
      .item-preview-crop img {
        position: absolute;
        left: var(--sheet-left, 0%);
        top: var(--sheet-top, 0%);
        width: var(--sheet-width, 100%);
        height: var(--sheet-height, 100%);
        object-fit: var(--image-fit, contain);
      }

      .image-unavailable {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        padding: 0.75rem;
        color: #d8cfbd;
        text-align: center;
      }

      .item-image-frame.failed .item-image-crop,
      .item-image-frame.failed .item-preview {
        display: none;
      }

      .item-image-frame.failed .image-unavailable {
        display: grid;
      }

      .item-preview {
        width: min(82vw, 32rem);
        position: fixed;
        left: 50%;
        top: 50%;
        z-index: 20;
        aspect-ratio: var(--image-aspect, 3 / 4);
        transform: translate(-50%, -50%);
        border: 1px solid #6a6d72;
        border-radius: 0.5rem;
        background: #111316;
        box-shadow: 0 2rem 5rem rgb(0 0 0 / 0.55);
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
        transition: opacity 0.15s ease 1.1s, visibility 0s linear 1.1s;
      }

      .item-image-frame:hover .item-preview,
      .item-image-frame:focus-within .item-preview {
        opacity: 1;
        visibility: visible;
      }

      .item-card.unavailable {
        opacity: 0.45;
      }

      .item-card input {
        width: auto;
        min-height: auto;
      }

      .item-card p,
      .item-card span {
        font-size: 0.95rem;
      }

      .item-type {
        color: #b7d7c0;
      }

      .message {
        min-height: 1.5rem;
        color: #b7d7c0;
      }

      .round-table {
        width: min(100%, 32rem);
        aspect-ratio: 1;
        position: relative;
        border: 2px solid #6a6d72;
        border-radius: 50%;
        background: #202327;
      }

      .table-center {
        position: absolute;
        inset: 34%;
        display: grid;
        place-items: center;
        border: 1px solid #4a4d52;
        border-radius: 50%;
        color: #d8cfbd;
        font-weight: 700;
      }

      .table-player {
        width: 8.5rem;
        min-height: 4rem;
        position: absolute;
        left: var(--x);
        top: var(--y);
        transform: translate(-50%, -50%);
        display: grid;
        gap: 0.2rem;
        place-items: center;
        padding: 0.5rem;
        border: 1px solid #6a6d72;
        border-radius: 0.5rem;
        background: #17191c;
        font-size: 0.9rem;
      }

      .table-player strong,
      .table-player span {
        max-width: 100%;
        overflow-wrap: anywhere;
      }

      .group-section {
        display: grid;
        gap: 0.5rem;
        align-content: start;
      }

      .group-section h4 {
        color: #b7d7c0;
      }

      .spectator-card {
        display: grid;
        gap: 0.5rem;
        padding: 0.75rem;
        border: 1px solid #4a4d52;
        border-radius: 0.5rem;
        background: #202327;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: rgb(0 0 0 / 0.68);
      }

      .modal {
        width: min(100%, 28rem);
        display: grid;
        gap: 1rem;
        padding: 1.25rem;
        border: 1px solid #4a4d52;
        border-radius: 0.5rem;
        background: #17191c;
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 0.4);
      }

      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main id="home-view" hidden>
      <h1>FrankenDraftTool</h1>
      <button id="create-room" type="button">Create Room</button>
      <p><span id="open-pages">0</span> open right now</p>
    </main>

    <main id="room-view" hidden>
      <h1>FrankenDraftTool</h1>
      <h2>Room <span id="room-number"></span></h2>
      <div class="actions">
        <button id="share-room" type="button">Share Room</button>
        <button id="sit-down" class="secondary" type="button" hidden>Sit Down</button>
        <button id="spectate-room" class="secondary" type="button" hidden>Become Spectator</button>
        <button id="restart-draft" class="secondary" type="button" hidden>Restart Draft</button>
      </div>
      <p id="room-status"></p>

      <section class="panel" id="creator-panel" hidden>
        <h3>Room Settings</h3>
        <div class="settings-grid">
          <label>
            Seat limit
            <input id="seat-limit-input" type="number" min="1" max="12" step="1">
          </label>
          <label>
            Draft pool
            <select id="pool-select"></select>
          </label>
          <label>
            Picks per bag
            <input id="picks-per-bag-input" type="number" min="1" max="8" step="1">
          </label>
        </div>
        <div class="settings-grid" id="item-type-settings"></div>
        <div class="actions">
          <button id="save-room-settings" type="button">Save Settings</button>
          <button id="start-draft" type="button">Start Draft</button>
        </div>
      </section>

      <section class="panel" id="seating-panel">
        <h3>Seated</h3>
        <ul id="seated-people"></ul>
        <p id="spectator-count"></p>
      </section>

      <section class="panel" id="table-panel" hidden>
        <h3>Round Table</h3>
        <div class="round-table" id="round-table"></div>
      </section>

      <section class="panel" id="spectator-panel">
        <h3>Spectators</h3>
        <p id="spectator-summary"></p>
        <div class="spectator-grid" id="named-spectators"></div>
      </section>

      <section class="panel" id="draft-display-panel" hidden>
        <h3>Draft Display</h3>
        <label>
          Organize drafted items by
          <select id="draft-grouping">
            <option value="type">Item type</option>
            <option value="pick">Pick order</option>
          </select>
        </label>
      </section>

      <section class="panel" id="player-draft-panel" hidden>
        <h3>Your Draft</h3>
        <p id="draft-instruction"></p>
        <div class="item-grid" id="current-bag"></div>
        <button id="lock-choice" type="button">Lock Choices</button>
        <h4>Drafted Items</h4>
        <div class="item-grid" id="private-drafted-items"></div>
      </section>

      <section class="panel" id="super-draft-panel" hidden>
        <h3>Super Spectator View</h3>
        <div class="reveal-grid" id="super-draft-areas"></div>
      </section>

      <section class="panel" id="reveal-panel" hidden>
        <h3>Final Drafts</h3>
        <div class="reveal-grid" id="revealed-drafts"></div>
      </section>

      <p class="message" id="room-message"></p>
    </main>

    <div class="modal-backdrop" id="join-modal" hidden>
      <form class="modal" id="join-form">
        <h3>Join Room</h3>
        <label>
          Name <span>(optional for spectators)</span>
          <input id="join-name" name="name" autocomplete="name" maxlength="40" placeholder="Your name">
        </label>
        <div class="actions">
          <button id="join-seat" type="submit">Sit Down</button>
          <button id="join-spectate" class="secondary" type="button">Spectate</button>
        </div>
      </form>
    </div>

    <div class="modal-backdrop" id="sit-modal" hidden>
      <form class="modal" id="sit-form">
        <h3>Sit Down</h3>
        <label>
          Name
          <input id="sit-name" name="name" autocomplete="name" maxlength="40" placeholder="Your name">
        </label>
        <div class="actions">
          <button type="submit">Sit Down</button>
          <button id="cancel-sit" class="secondary" type="button">Cancel</button>
        </div>
      </form>
    </div>

    <script>
      const backendOrigin =
        window.location.hostname === "yvonick-frankendrafttool.onrender.com"
          ? "https://yvonick-frankendrafttool-api.onrender.com"
          : "";

      const apiUrl = (path) => `${backendOrigin}${path}`;
      const homeView = document.querySelector("#home-view");
      const roomView = document.querySelector("#room-view");
      const openPages = document.querySelector("#open-pages");
      const createRoom = document.querySelector("#create-room");
      const roomNumber = document.querySelector("#room-number");
      const shareRoom = document.querySelector("#share-room");
      const sitDown = document.querySelector("#sit-down");
      const spectateRoom = document.querySelector("#spectate-room");
      const restartDraft = document.querySelector("#restart-draft");
      const roomStatus = document.querySelector("#room-status");
      const seatingPanel = document.querySelector("#seating-panel");
      const seatedPeople = document.querySelector("#seated-people");
      const spectatorCount = document.querySelector("#spectator-count");
      const spectatorPanel = document.querySelector("#spectator-panel");
      const spectatorSummary = document.querySelector("#spectator-summary");
      const namedSpectators = document.querySelector("#named-spectators");
      const roomMessage = document.querySelector("#room-message");
      const creatorPanel = document.querySelector("#creator-panel");
      const seatLimitInput = document.querySelector("#seat-limit-input");
      const poolSelect = document.querySelector("#pool-select");
      const picksPerBagInput = document.querySelector("#picks-per-bag-input");
      const itemTypeSettings = document.querySelector("#item-type-settings");
      const saveRoomSettings = document.querySelector("#save-room-settings");
      const startDraft = document.querySelector("#start-draft");
      const tablePanel = document.querySelector("#table-panel");
      const roundTable = document.querySelector("#round-table");
      const draftDisplayPanel = document.querySelector("#draft-display-panel");
      const playerDraftPanel = document.querySelector("#player-draft-panel");
      const draftGrouping = document.querySelector("#draft-grouping");
      const draftInstruction = document.querySelector("#draft-instruction");
      const currentBag = document.querySelector("#current-bag");
      const lockChoice = document.querySelector("#lock-choice");
      const privateDraftedItems = document.querySelector("#private-drafted-items");
      const superDraftPanel = document.querySelector("#super-draft-panel");
      const superDraftAreas = document.querySelector("#super-draft-areas");
      const revealPanel = document.querySelector("#reveal-panel");
      const revealedDrafts = document.querySelector("#revealed-drafts");
      const joinModal = document.querySelector("#join-modal");
      const joinForm = document.querySelector("#join-form");
      const joinName = document.querySelector("#join-name");
      const joinSpectate = document.querySelector("#join-spectate");
      const sitModal = document.querySelector("#sit-modal");
      const sitForm = document.querySelector("#sit-form");
      const sitName = document.querySelector("#sit-name");
      const cancelSit = document.querySelector("#cancel-sit");
      let roomEvents = null;
      let currentRoomNumber = null;
      let currentRole = null;
      let currentViewerId = null;
      let latestRoom = null;
      let pools = [];
      let settingsInitialized = false;
      let selectedItemIds = new Set();
      let currentBagId = null;

      function show(view) {
        homeView.hidden = view !== homeView;
        roomView.hidden = view !== roomView;
      }

      function storageKey(roomId, key) {
        return `room:${roomId}:${key}`;
      }

      function makeId() {
        return crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
      }

      function participantIdFor(roomId) {
        const key = storageKey(roomId, "participantId");
        const existing = sessionStorage.getItem(key);

        if (existing) {
          return existing;
        }

        const id = makeId();
        sessionStorage.setItem(key, id);
        return id;
      }

      async function fetchPools() {
        if (pools.length > 0) {
          return;
        }

        const response = await fetch(apiUrl("/api/pools"));
        const data = await response.json();
        pools = data.pools;
      }

      function startHomePresence() {
        const presence = new EventSource(apiUrl("/api/presence"));

        presence.onmessage = (event) => {
          const data = JSON.parse(event.data);
          openPages.textContent = String(data.openPages);
        };

        presence.onerror = () => {
          openPages.textContent = "?";
        };
      }

      function renderSeated(players) {
        seatedPeople.replaceChildren();

        if (players.length === 0) {
          const item = document.createElement("li");
          item.textContent = "No one seated yet";
          seatedPeople.append(item);
          return;
        }

        for (const player of players) {
          const item = document.createElement("li");
          item.textContent = player.name;
          seatedPeople.append(item);
        }
      }

      function createImageCrop(item) {
        const crop = document.createElement("div");
        crop.className = "item-image-crop";
        const image = document.createElement("img");
        image.src = item.imageUrl;
        image.alt = item.name;
        image.loading = "lazy";

        if (item.imageSheet) {
          const { columns, rows, index } = item.imageSheet;
          const column = index % columns;
          const row = Math.floor(index / columns);
          crop.style.setProperty("--sheet-width", `${columns * 100}%`);
          crop.style.setProperty("--sheet-height", `${rows * 100}%`);
          crop.style.setProperty("--sheet-left", `${-column * 100}%`);
          crop.style.setProperty("--sheet-top", `${-row * 100}%`);
          crop.style.setProperty("--image-fit", "fill");
        }

        crop.append(image);
        return crop;
      }

      function getImageAspect(item) {
        if (item.imageSheet || item.sourceObjectType === "Card" || item.sourceObjectType === "CardCustom") {
          return "3 / 4";
        }

        if (item.sourceObjectType === "Custom_Model") {
          return "1 / 1";
        }

        return "4 / 3";
      }

      function renderItemImage(item) {
        const frame = document.createElement("div");
        frame.className = "item-image-frame";
        frame.style.setProperty("--image-aspect", getImageAspect(item));
        frame.setAttribute("tabindex", "0");
        frame.setAttribute("aria-label", item.name);
        const crop = createImageCrop(item);
        const preview = document.createElement("div");
        preview.className = "item-preview";
        const previewCrop = createImageCrop(item);
        previewCrop.className = "item-preview-crop";
        const unavailable = document.createElement("div");
        unavailable.className = "image-unavailable";
        unavailable.textContent = "Image unavailable";

        for (const image of [...crop.querySelectorAll("img"), ...previewCrop.querySelectorAll("img")]) {
          image.addEventListener("error", () => {
            frame.classList.add("failed");
          });
        }

        preview.append(previewCrop);
        frame.append(crop, preview, unavailable);
        return frame;
      }

      function renderItemCard(item, options = {}) {
        const card = document.createElement("label");
        card.className = options.available === false ? "item-card unavailable" : "item-card";

        if (options.checkable) {
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.value = item.id;
          checkbox.disabled = options.available === false;
          checkbox.checked = selectedItemIds.has(item.id);
          card.append(checkbox);
        }

        if (item.imageUrl) {
          card.append(renderItemImage(item));
        }

        const name = document.createElement("strong");
        name.textContent = item.name;
        const type = document.createElement("span");
        type.className = "item-type";
        type.textContent = item.type;
        const content = document.createElement("p");
        content.textContent = item.content;

        card.append(name, type, content);
        return card;
      }

      function renderItems(container, items) {
        container.replaceChildren();

        if (items.length === 0) {
          const empty = document.createElement("p");
          empty.textContent = "None yet";
          container.append(empty);
          return;
        }

        for (const item of items) {
          container.append(renderItemCard(item));
        }
      }

      function groupItemsByType(items) {
        const grouped = new Map();

        for (const item of items) {
          if (!grouped.has(item.type)) {
            grouped.set(item.type, []);
          }

          grouped.get(item.type).push(item);
        }

        return [...grouped.entries()].map(([label, groupItems]) => ({ label, items: groupItems }));
      }

      function groupItemsByPick(groups = [], fallbackItems = []) {
        if (groups.length === 0 && fallbackItems.length > 0) {
          return [{ label: "Pick 1", items: fallbackItems }];
        }

        return groups.map((group) => ({
          label: `Pick ${group.pickNumber}`,
          items: group.items
        }));
      }

      function renderGroupedItems(container, items, groups = []) {
        container.replaceChildren();

        if (items.length === 0) {
          const empty = document.createElement("p");
          empty.textContent = "None yet";
          container.append(empty);
          return;
        }

        const sections = draftGrouping.value === "pick"
          ? groupItemsByPick(groups, items)
          : groupItemsByType(items);

        for (const section of sections) {
          const wrapper = document.createElement("section");
          wrapper.className = "group-section";
          const title = document.createElement("h4");
          title.textContent = section.label;
          const grid = document.createElement("div");
          grid.className = "item-grid";
          wrapper.append(title, grid);
          renderItems(grid, section.items);
          container.append(wrapper);
        }
      }

      function poolById(poolId) {
        return pools.find((pool) => pool.id === poolId);
      }

      function renderTypeInputs(pool, values) {
        itemTypeSettings.replaceChildren();

        for (const itemType of pool.itemTypes) {
          const label = document.createElement("label");
          const input = document.createElement("input");
          input.type = "number";
          input.min = "0";
          input.max = "10";
          input.step = "1";
          input.dataset.itemType = itemType.type;
          input.value = values?.[itemType.type] ?? pool.defaultParameters.itemsPerType[itemType.type] ?? 0;
          label.append(`${itemType.type} per bag`, input);
          itemTypeSettings.append(label);
        }
      }

      function renderDraftSettings(settings) {
        if (settingsInitialized) {
          return;
        }

        poolSelect.replaceChildren();

        for (const pool of pools) {
          const option = document.createElement("option");
          option.value = pool.id;
          option.textContent = pool.name;
          poolSelect.append(option);
        }

        const pool = poolById(settings.poolId) || pools[0];
        poolSelect.value = pool.id;
        picksPerBagInput.value = settings.picksPerBag;
        renderTypeInputs(pool, settings.itemsPerType);
        settingsInitialized = true;
      }

      function collectDraftSettings() {
        const itemsPerType = {};

        for (const input of itemTypeSettings.querySelectorAll("input[data-item-type]")) {
          itemsPerType[input.dataset.itemType] = Number(input.value);
        }

        return {
          maxSeats: Number(seatLimitInput.value),
          poolId: poolSelect.value,
          picksPerBag: Number(picksPerBagInput.value),
          itemsPerType
        };
      }

      function isCreator() {
        return Boolean(sessionStorage.getItem(storageKey(currentRoomNumber, "creatorToken")));
      }

      function renderSpectators(room) {
        spectatorSummary.textContent = `${room.spectators} spectator${room.spectators === 1 ? "" : "s"}`;
        spectatorCount.textContent = spectatorSummary.textContent;
        namedSpectators.replaceChildren();

        if (room.namedSpectators.length === 0) {
          const empty = document.createElement("p");
          empty.textContent = "No named spectators";
          namedSpectators.append(empty);
          return;
        }

        for (const spectator of room.namedSpectators) {
          const card = document.createElement("section");
          card.className = "spectator-card";
          const name = document.createElement("strong");
          name.textContent = spectator.name;
          const status = document.createElement("span");
          status.textContent = spectator.superSpectator ? "Super spectator" : "Spectator";
          card.append(name, status);

          if (isCreator()) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "secondary";
            button.dataset.participantId = spectator.id;
            button.dataset.superSpectator = spectator.superSpectator ? "false" : "true";
            button.textContent = spectator.superSpectator ? "Remove Super" : "Make Super";
            card.append(button);
          }

          namedSpectators.append(card);
        }
      }

      function renderTable(draft) {
        tablePanel.hidden = draft.status === "not_started";
        roundTable.replaceChildren();

        if (draft.status === "not_started") {
          return;
        }

        const center = document.createElement("div");
        center.className = "table-center";
        center.textContent = `${latestRoom.spectators} watching`;
        roundTable.append(center);

        const total = draft.table.length;

        for (const player of draft.table) {
          const angle = (Math.PI * 2 * (player.seat - 1)) / total - Math.PI / 2;
          const card = document.createElement("div");
          card.className = "table-player";
          card.style.setProperty("--x", `${50 + Math.cos(angle) * 42}%`);
          card.style.setProperty("--y", `${50 + Math.sin(angle) * 42}%`);
          const name = document.createElement("strong");
          name.textContent = player.name;
          const seat = document.createElement("span");
          seat.textContent = `Seat ${player.seat}`;
          const queue = document.createElement("span");
          queue.textContent = `${player.queueLength} bag${player.queueLength === 1 ? "" : "s"} queued`;
          const looking = document.createElement("span");
          looking.textContent = player.lookingAtBag ? "Looking at a bag" : "No current bag";
          card.append(name, seat, queue, looking);
          roundTable.append(card);
        }
      }

      function updateLockButton(requiredPickCount) {
        const selectedCount = selectedItemIds.size;
        lockChoice.textContent = requiredPickCount === 0 ? "Pass Bag" : "Lock Choices";
        lockChoice.disabled = selectedCount !== requiredPickCount;
      }

      function renderCurrentBag(currentPlayer) {
        currentBag.replaceChildren();

        if (!currentPlayer.currentBag) {
          draftInstruction.textContent = currentPlayer.queueLength === 0
            ? "No bags in your queue."
            : `${currentPlayer.queueLength} bag${currentPlayer.queueLength === 1 ? "" : "s"} in your queue. Waiting for your next bag.`;
          lockChoice.hidden = true;
          return;
        }

        const bag = currentPlayer.currentBag;

        if (currentBagId !== bag.id) {
          currentBagId = bag.id;
          selectedItemIds = new Set();
        }

        const eligible = new Set(bag.eligibleItemIds);
        draftInstruction.textContent = `${currentPlayer.queueLength} bag${currentPlayer.queueLength === 1 ? "" : "s"} in your queue. Select ${bag.requiredPickCount} item${bag.requiredPickCount === 1 ? "" : "s"} from this bag.`;

        for (const item of bag.items) {
          currentBag.append(renderItemCard(item, {
            checkable: true,
            available: eligible.has(item.id)
          }));
        }

        lockChoice.hidden = false;
        updateLockButton(bag.requiredPickCount);
      }

      function renderPlayerDraft(draft) {
        const currentPlayer = draft.currentPlayer;
        playerDraftPanel.hidden = draft.status !== "active" || !currentPlayer;

        if (playerDraftPanel.hidden) {
          return;
        }

        renderCurrentBag(currentPlayer);
        renderGroupedItems(privateDraftedItems, currentPlayer.draftedItems, currentPlayer.draftedGroups);
      }

      function renderSuperSpectatorDraft(draft) {
        superDraftPanel.hidden = draft.status !== "active" || !draft.superSpectator;
        superDraftAreas.replaceChildren();

        if (superDraftPanel.hidden) {
          return;
        }

        for (const player of draft.superSpectator.players) {
          const section = document.createElement("section");
          section.className = "item-card";
          const title = document.createElement("h4");
          title.textContent = `${player.name} (${player.queueLength} bag${player.queueLength === 1 ? "" : "s"})`;
          const bagTitle = document.createElement("p");
          bagTitle.textContent = player.currentBag ? "Current bag" : "No current bag";
          const bagGrid = document.createElement("div");
          bagGrid.className = "item-grid";
          const draftedTitle = document.createElement("p");
          draftedTitle.textContent = "Drafted";
          const draftedGrid = document.createElement("div");
          draftedGrid.className = "item-grid";
          section.append(title, bagTitle, bagGrid, draftedTitle, draftedGrid);
          renderItems(bagGrid, player.currentBag?.items || []);
          renderGroupedItems(draftedGrid, player.draftedItems, player.draftedGroups);
          superDraftAreas.append(section);
        }
      }

      function renderReveal(draft) {
        revealPanel.hidden = draft.status !== "complete";
        revealedDrafts.replaceChildren();

        if (draft.status !== "complete") {
          return;
        }

        for (const player of draft.revealedDrafts) {
          const section = document.createElement("section");
          section.className = "item-card";
          const title = document.createElement("h4");
          title.textContent = player.name;
          const items = document.createElement("div");
          items.className = "item-grid";
          section.append(title, items);
          renderGroupedItems(items, player.items, player.groups);
          revealedDrafts.append(section);
        }
      }

      function renderDraft(draft) {
        draftDisplayPanel.hidden = draft.status === "not_started";
        renderTable(draft);
        renderPlayerDraft(draft);
        renderSuperSpectatorDraft(draft);
        renderReveal(draft);

        if (draft.status === "active" && !draft.currentPlayer) {
          roomMessage.textContent = currentRole === "spectator" ? "Spectating draft." : roomMessage.textContent;
        }

        if (draft.status === "complete") {
          roomMessage.textContent = "Draft complete.";
        }
      }

      function renderRoom(data) {
        latestRoom = data;
        renderSeated(data.seated);
        roomStatus.textContent = `${data.seated.length} of ${data.maxSeats} seats filled`;
        renderSpectators(data);
        seatLimitInput.value = data.maxSeats;

        if (data.draft.status === "not_started") {
          renderDraftSettings(data.draft.settings);
        }

        const roomIsFull = data.seated.length === data.maxSeats;
        const draftNotStarted = data.draft.status === "not_started";
        creatorPanel.hidden = !isCreator() || !draftNotStarted;
        restartDraft.hidden = !isCreator() || draftNotStarted;
        seatingPanel.hidden = !draftNotStarted;
        startDraft.disabled = !roomIsFull;
        sitDown.hidden = currentRole !== "spectator" || !draftNotStarted;
        spectateRoom.hidden = currentRole !== "seated" || !draftNotStarted;
        renderDraft(data.draft);
      }

      function openJoinModal() {
        joinModal.hidden = false;
        joinName.focus();
      }

      function closeJoinModal() {
        joinModal.hidden = true;
      }

      function openSitModal() {
        sitName.value = sessionStorage.getItem(storageKey(currentRoomNumber, "name")) || "";
        sitModal.hidden = false;
        sitName.focus();
      }

      function closeSitModal() {
        sitModal.hidden = true;
      }

      function connectToRoom(role, name = "") {
        if (roomEvents) {
          roomEvents.close();
        }

        currentViewerId = participantIdFor(currentRoomNumber);
        const params = new URLSearchParams({
          role,
          participantId: currentViewerId
        });

        if (name) {
          params.set("name", name);
        }

        roomEvents = new EventSource(apiUrl(`/api/rooms/${currentRoomNumber}/presence?${params}`));

        roomEvents.addEventListener("viewer", (event) => {
          const viewer = JSON.parse(event.data);
          currentViewerId = viewer.id;
          currentRole = viewer.role;
          sitDown.hidden = currentRole !== "spectator" || latestRoom?.draft.status !== "not_started";

          if (viewer.name) {
            sessionStorage.setItem(storageKey(currentRoomNumber, "name"), viewer.name);
          }

          sessionStorage.setItem(storageKey(currentRoomNumber, "participantId"), viewer.id);
          sessionStorage.setItem(storageKey(currentRoomNumber, "role"), currentRole);

          if (viewer.seatDenied) {
            roomMessage.textContent = "All seats are filled, so you are spectating for now.";
          } else {
            roomMessage.textContent = currentRole === "seated" ? "You are seated." : "You are spectating.";
          }
        });

        roomEvents.onmessage = (event) => {
          renderRoom(JSON.parse(event.data));
        };

        roomEvents.onerror = () => {
          roomMessage.textContent = "Connection lost. Trying to reconnect...";
        };
      }

      async function enterRoom(id) {
        currentRoomNumber = id;
        await fetchPools();
        const response = await fetch(apiUrl(`/api/rooms/${id}`));

        roomNumber.textContent = id;
        shareRoom.disabled = false;

        if (!response.ok) {
          renderSeated([{ name: "Room not found" }]);
          roomStatus.textContent = "";
          spectatorCount.textContent = "";
          sitDown.hidden = true;
          show(roomView);
          return;
        }

        const room = await response.json();
        renderRoom(room);
        show(roomView);

        const savedRole = sessionStorage.getItem(storageKey(id, "role"));
        const savedName = sessionStorage.getItem(storageKey(id, "name"));

        if (savedRole === "seated" && savedName) {
          connectToRoom("seated", savedName);
          return;
        }

        if (savedRole === "spectator") {
          connectToRoom("spectator");
          return;
        }

        openJoinModal();
      }

      async function handleCreateRoom() {
        createRoom.disabled = true;

        try {
          const response = await fetch(apiUrl("/api/rooms"), {
            method: "POST"
          });

          if (!response.ok) {
            throw new Error("Room creation failed");
          }

          const room = await response.json();
          sessionStorage.setItem(storageKey(room.roomNumber, "creatorToken"), room.creatorToken);
          window.location.href = room.path;
        } catch (error) {
          createRoom.disabled = false;
          openPages.textContent = "Could not create a room";
        }
      }

      async function copyShareUrl() {
        try {
          await navigator.clipboard.writeText(window.location.href);
          roomMessage.textContent = "Room URL copied.";
        } catch (error) {
          roomMessage.textContent = "Could not copy the room URL.";
        }
      }

      async function saveSettings(options = {}) {
        const creatorToken = sessionStorage.getItem(storageKey(currentRoomNumber, "creatorToken"));
        saveRoomSettings.disabled = true;

        try {
          const response = await fetch(apiUrl(`/api/rooms/${currentRoomNumber}/settings`), {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              creatorToken,
              ...collectDraftSettings()
            })
          });

          const data = await response.json();

          if (!response.ok) {
            roomMessage.textContent =
              data.error === "seat_limit_below_current_players"
                ? "Seat limit cannot be below the number of seated players."
                : "Could not save room settings.";
            return false;
          }

          renderRoom(data);

          if (!options.silent) {
            roomMessage.textContent = "Room settings saved.";
          }

          return true;
        } finally {
          saveRoomSettings.disabled = false;
        }
      }

      async function handleStartDraft() {
        startDraft.disabled = true;
        const settingsSaved = await saveSettings({ silent: true });

        if (!settingsSaved) {
          startDraft.disabled = false;
          return;
        }

        const creatorToken = sessionStorage.getItem(storageKey(currentRoomNumber, "creatorToken"));
        const response = await fetch(apiUrl(`/api/rooms/${currentRoomNumber}/draft/start`), {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            creatorToken,
            participantId: currentViewerId
          })
        });
        const data = await response.json();

        if (!response.ok) {
          roomMessage.textContent = data.error === "room_not_full"
            ? "The room must be full before starting."
            : "Could not start the draft.";
          startDraft.disabled = false;
          return;
        }

        renderRoom(data);
        roomMessage.textContent = "Draft started.";
      }

      async function handleRestartDraft() {
        restartDraft.disabled = true;
        const creatorToken = sessionStorage.getItem(storageKey(currentRoomNumber, "creatorToken"));
        const response = await fetch(apiUrl(`/api/rooms/${currentRoomNumber}/draft/restart`), {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            creatorToken,
            participantId: currentViewerId
          })
        });
        const data = await response.json();

        if (!response.ok) {
          roomMessage.textContent = "Could not restart the draft.";
          restartDraft.disabled = false;
          return;
        }

        settingsInitialized = false;
        selectedItemIds = new Set();
        currentBagId = null;
        renderRoom(data);
        roomMessage.textContent = "Draft reset.";
        restartDraft.disabled = false;
      }

      async function setSuperSpectator(participantId, superSpectator) {
        const creatorToken = sessionStorage.getItem(storageKey(currentRoomNumber, "creatorToken"));
        const response = await fetch(apiUrl(`/api/rooms/${currentRoomNumber}/spectators/promote`), {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            creatorToken,
            participantId,
            viewerId: currentViewerId,
            superSpectator
          })
        });
        const data = await response.json();

        if (!response.ok) {
          roomMessage.textContent = "Could not update spectator permissions.";
          return;
        }

        renderRoom(data);
        roomMessage.textContent = "Spectator permissions updated.";
      }

      async function lockCurrentChoice() {
        if (!latestRoom?.draft.currentPlayer?.currentBag) {
          return;
        }

        lockChoice.disabled = true;
        const response = await fetch(apiUrl(`/api/rooms/${currentRoomNumber}/draft/pick`), {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            playerId: currentViewerId,
            itemIds: [...selectedItemIds]
          })
        });
        const data = await response.json();

        if (!response.ok) {
          roomMessage.textContent = data.error === "wrong_pick_count"
            ? `Select ${data.requiredPickCount} item${data.requiredPickCount === 1 ? "" : "s"}.`
            : "Could not lock that choice.";
          lockChoice.disabled = false;
          return;
        }

        selectedItemIds = new Set();
        currentBagId = null;
        renderRoom(data);
        roomMessage.textContent = "Choice locked.";
      }

      joinForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = joinName.value.trim();

        if (!name) {
          joinName.focus();
          return;
        }

        closeJoinModal();
        connectToRoom("seated", name);
      });

      joinSpectate.addEventListener("click", () => {
        const name = joinName.value.trim();
        closeJoinModal();
        connectToRoom("spectator", name);
      });

      sitDown.addEventListener("click", openSitModal);
      spectateRoom.addEventListener("click", () => {
        const name = sessionStorage.getItem(storageKey(currentRoomNumber, "name")) || "";
        connectToRoom("spectator", name);
      });
      cancelSit.addEventListener("click", closeSitModal);
      sitForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = sitName.value.trim();

        if (!name) {
          sitName.focus();
          return;
        }

        closeSitModal();
        connectToRoom("seated", name);
      });

      currentBag.addEventListener("change", (event) => {
        if (event.target.type !== "checkbox") {
          return;
        }

        const itemId = event.target.value;
        const requiredPickCount = latestRoom.draft.currentPlayer.currentBag.requiredPickCount;

        if (event.target.checked) {
          if (selectedItemIds.size >= requiredPickCount) {
            event.target.checked = false;
            return;
          }

          selectedItemIds.add(itemId);
        } else {
          selectedItemIds.delete(itemId);
        }

        updateLockButton(requiredPickCount);
      });

      poolSelect.addEventListener("change", () => {
        const pool = poolById(poolSelect.value);

        if (!pool) {
          return;
        }

        picksPerBagInput.value = pool.defaultParameters.picksPerBag;
        renderTypeInputs(pool, pool.defaultParameters.itemsPerType);
      });

      namedSpectators.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-participant-id]");

        if (!button) {
          return;
        }

        setSuperSpectator(button.dataset.participantId, button.dataset.superSpectator === "true");
      });

      draftGrouping.addEventListener("change", () => {
        if (latestRoom) {
          renderRoom(latestRoom);
        }
      });

      shareRoom.addEventListener("click", copyShareUrl);
      saveRoomSettings.addEventListener("click", () => saveSettings());
      startDraft.addEventListener("click", handleStartDraft);
      restartDraft.addEventListener("click", handleRestartDraft);
      lockChoice.addEventListener("click", lockCurrentChoice);

      const roomMatch = window.location.pathname.match(/^\/rooms\/(\d{6})$/);

      if (roomMatch) {
        enterRoom(roomMatch[1]);
      } else {
        show(homeView);
        startHomePresence();
        createRoom.addEventListener("click", handleCreateRoom);
      }
    </script>
  </body>
</html>
