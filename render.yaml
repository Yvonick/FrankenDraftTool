services:
  - type: web
    name: yvonick-frankendrafttool-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: services/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: pool-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://yvonick-frankendrafttool.onrender.com
      - key: POOL_STORE_PATH
        value: /var/data/public-pools.json
      - key: DRAFT_METHOD_STORE_PATH
        value: /var/data/draft-methods.json

  - type: web
    name: yvonick-frankendrafttool
    runtime: static
    buildCommand: echo "No frontend build step"
    staticPublishPath: services/frontend
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /api/*
        destination: https://yvonick-frankendrafttool-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
